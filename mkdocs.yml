# AI 能力工程：从 Skill、MCP 到 Agent
# 基于 MkDocs + Material for MkDocs 构建

site_name: AI 能力工程：从 Skill、MCP 到 Agent
site_description: 构建可复用、可调用、可验证的 AI 执行系统 —— Skill · MCP · Agent 三层知识链路
site_author: ai-capability-engineering
docs_dir: cn
use_directory_urls: true

# 部署到 GitHub Pages 后，将下面的注释取消并填上真实地址：
# site_url: https://<your-github-username>.github.io/<your-repo>/

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式
  icon:
    logo: material/robot-industrial
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search:
      lang:
        - zh
        - en

extra_javascript:
  - https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js

extra_css:
  - assets/custom.css
