<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">MCP Host Client Server Architecture</title>
  <desc id="desc">A host application coordinates MCP clients, which connect to multiple MCP servers and external tools.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fed"/>
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:18;ry:18}
      .host{fill:#e0f2fe;stroke:#0369a1}
      .client{fill:#ecfdf5;stroke:#047857}
      .server{fill:#fff7ed;stroke:#c2410c}
      .tool{fill:#f1f5f9;stroke:#64748b}
      .title{font:700 22px Arial,sans-serif;fill:#0f172a}
      .label{font:600 17px Arial,sans-serif;fill:#0f172a}
      .small{font:14px Arial,sans-serif;fill:#475569}
      .line{stroke:#2f6fed;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="42" text-anchor="middle" class="title">MCP Host / Client / Server</text>
  <rect x="55" y="132" width="205" height="120" class="box host"/>
  <text x="157" y="178" text-anchor="middle" class="label">Host Application</text>
  <text x="157" y="206" text-anchor="middle" class="small">IDE, desktop app, agent</text>
  <rect x="350" y="90" width="205" height="86" class="box client"/>
  <text x="452" y="127" text-anchor="middle" class="label">MCP Client A</text>
  <text x="452" y="151" text-anchor="middle" class="small">session and routing</text>
  <rect x="350" y="230" width="205" height="86" class="box client"/>
  <text x="452" y="267" text-anchor="middle" class="label">MCP Client B</text>
  <text x="452" y="291" text-anchor="middle" class="small">session and routing</text>
  <rect x="665" y="74" width="220" height="82" class="box server"/>
  <text x="775" y="111" text-anchor="middle" class="label">MCP Server</text>
  <text x="775" y="134" text-anchor="middle" class="small">tools and resources</text>
  <rect x="665" y="198" width="220" height="82" class="box server"/>
  <text x="775" y="235" text-anchor="middle" class="label">MCP Server</text>
  <text x="775" y="258" text-anchor="middle" class="small">prompts and data</text>
  <rect x="665" y="322" width="220" height="58" class="box tool"/>
  <text x="775" y="357" text-anchor="middle" class="label">External Systems</text>
  <path d="M260 177 C300 148 312 134 350 133" class="line"/>
  <path d="M260 207 C300 238 313 273 350 273" class="line"/>
  <path d="M555 126 C600 114 621 113 665 115" class="line"/>
  <path d="M555 268 C605 246 620 239 665 239" class="line"/>
  <path d="M775 280 L775 322" class="line"/>
</svg>
