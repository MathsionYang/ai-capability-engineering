schema:
  type: object
  required: [checkpoint_id, task_id, schema_version, created_at, status, cursor, resume_policy, state, failure, owner]
  properties:
    checkpoint_id: {type: string}
    task_id: {type: string}
    schema_version: {type: integer}
    created_at: {type: string, format: date-time}
    status: {type: string, enum: [submitted, working, validating, retrying, input-required, waiting-confirmation, completed, failed, cancelled]}
    cursor:
      type: object
      required: [step_id, step_index, completed_steps]
      properties: {step_id: {type: string}, step_index: {type: integer}, completed_steps: {type: array, items: {type: string}}}
    resume_policy:
      type: object
      required: [idempotency_key]
      properties: {idempotency_key: {type: string}, replay_mode: {type: string, enum: [deterministic, guarded, manual]}, max_retries: {type: integer}}
    state:
      type: object
      required: [side_effects, side_effect_log, retry_count, input_artifacts, output_artifacts]
      properties:
        side_effects: {type: integer, minimum: 0}
        side_effect_log: {type: array, items: {type: string}}
        retry_count: {type: integer, minimum: 0}
        fixture: {type: string}
        input_artifacts: {type: array, items: {type: object, required: [ref, hash], properties: {ref: {type: string, pattern: '^artifact://'}, hash: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}}}}
        output_artifacts: {type: array, items: {type: object, required: [ref, hash], properties: {ref: {type: string, pattern: '^artifact://'}, hash: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}}}}
    failure:
      type: object
      required: [code, message, retryable, failed_at]
      properties:
        code: {type: [string, "null"], enum: [incomplete_input, tool_timeout, validation_failed, permission_denied, duplicate_execution, "null"]}
        message: {type: [string, "null"]}
        retryable: {type: boolean}
        failed_at: {type: [string, "null"]}
    owner: {type: object, required: [agent_id, graph_version], properties: {agent_id: {type: string}, graph_version: {type: string}}}
example:
  checkpoint_id: cp_fix_042_002
  task_id: fix-issue-42
  schema_version: 1
  created_at: 2026-09-09T10:15:00+08:00
  status: waiting-confirmation
  cursor: {step_id: apply_patch, step_index: 2, completed_steps: [inspect, propose]}
  resume_policy: {idempotency_key: fix-issue-42:apply_patch:1, replay_mode: deterministic, max_retries: 1}
  state:
    goal: repair failing test
    input_artifacts: []
    output_artifacts: []
    side_effects: 0
    side_effect_log: []
    retry_count: 0
    pending_confirmation: true
  failure: {code: null, message: null, retryable: false, failed_at: null}
  owner: {agent_id: code-repair-agent, graph_version: v1}
