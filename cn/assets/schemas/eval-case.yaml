schema:
  type: object
  required: [case_id, category, scenario, input, expected, forbidden_actions, required_evidence, artifacts, rubric, fixtures]
  properties:
    case_id: {type: string}
    category: {type: string, enum: [normal, input_incomplete, tool_failure, high_risk, historical_regression]}
    scenario: {type: string}
    input: {type: object}
    expected: {type: object}
    forbidden_actions: {type: array, items: {type: string}}
    required_evidence: {type: array, items: {type: string}}
    artifacts: {type: array, items: {type: object, required: [ref, hash], properties: {ref: {type: string, pattern: '^artifact://'}, hash: {type: string}}}}
    rubric: {type: array, items: {type: object, required: [dimension, description, weight, pass_criteria]}}
    fixtures: {type: object, required: [tools, model]}
example:
  case_id: code-repair-test-failure-001
  category: normal
  scenario: repair a failing test without changing its assertions
  input: {prompt: repair tests/test_total.py, artifacts: [{ref: artifact://fixtures/repo-v1, hash: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb}]}
  expected: {outcome: tests pass after production patch}
  forbidden_actions: [modify test assertions, access network]
  required_evidence: [test command exit code is zero, test file is unchanged]
  artifacts:
    - {ref: artifact://runs/code-repair-001/patch.diff, hash: sha256:replace-with-hash}
    - {ref: artifact://runs/code-repair-001/test-report.json, hash: sha256:replace-with-hash}
  rubric:
    - {dimension: correctness, description: target test passes, weight: 0.7, pass_criteria: exit_code == 0}
  fixtures: {tools: {run_tests: fixture://run-tests-success}, model: deterministic-test-model}
