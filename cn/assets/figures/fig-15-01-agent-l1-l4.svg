<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Agent L1 to L4 Evolution Path</title>
  <desc id="desc">A staged evolution from assistant, to tool user, to workflow executor, to autonomous operating system.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .step{stroke:#334155;stroke-width:2;rx:18;ry:18}.s1{fill:#dbeafe}.s2{fill:#dcfce7}.s3{fill:#ffedd5}.s4{fill:#ede9fe}.title{font:700 22px Arial,sans-serif;fill:#0f172a}.label{font:700 18px Arial,sans-serif;fill:#0f172a}.small{font:14px Arial,sans-serif;fill:#475569}.line{stroke:#2563eb;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="42" text-anchor="middle" class="title">Agent L1 to L4 Evolution</text>
  <rect x="60" y="150" width="180" height="120" class="step s1"/>
  <text x="150" y="188" text-anchor="middle" class="label">L1 Assistant</text>
  <text x="150" y="218" text-anchor="middle" class="small">single-turn help</text>
  <text x="150" y="242" text-anchor="middle" class="small">human drives flow</text>
  <rect x="285" y="150" width="180" height="120" class="step s2"/>
  <text x="375" y="188" text-anchor="middle" class="label">L2 Tool User</text>
  <text x="375" y="218" text-anchor="middle" class="small">calls tools</text>
  <text x="375" y="242" text-anchor="middle" class="small">returns artifacts</text>
  <rect x="510" y="150" width="180" height="120" class="step s3"/>
  <text x="600" y="188" text-anchor="middle" class="label">L3 Workflow</text>
  <text x="600" y="218" text-anchor="middle" class="small">plans steps</text>
  <text x="600" y="242" text-anchor="middle" class="small">checks progress</text>
  <rect x="735" y="150" width="180" height="120" class="step s4"/>
  <text x="825" y="188" text-anchor="middle" class="label">L4 Autonomy</text>
  <text x="825" y="218" text-anchor="middle" class="small">runs missions</text>
  <text x="825" y="242" text-anchor="middle" class="small">learns safely</text>
  <line x1="240" y1="210" x2="285" y2="210" class="line"/>
  <line x1="465" y1="210" x2="510" y2="210" class="line"/>
  <line x1="690" y1="210" x2="735" y2="210" class="line"/>
  <text x="480" y="332" text-anchor="middle" class="small">increasing tool breadth, statefulness, evaluation, and responsibility</text>
</svg>
