<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Skill MCP Agent Call Chain</title>
  <desc id="desc">Skills package expertise, MCP exposes capabilities, and agents orchestrate decisions and actions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .box{stroke:#334155;stroke-width:2;rx:18;ry:18}.skill{fill:#dcfce7}.mcp{fill:#e0f2fe}.agent{fill:#ede9fe}.system{fill:#ffedd5}.title{font:700 22px Arial,sans-serif;fill:#0f172a}.label{font:700 18px Arial,sans-serif;fill:#0f172a}.small{font:14px Arial,sans-serif;fill:#475569}.line{stroke:#2563eb;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="42" text-anchor="middle" class="title">Skill / MCP / Agent Call Chain</text>
  <rect x="55" y="150" width="185" height="118" class="box skill"/>
  <text x="148" y="188" text-anchor="middle" class="label">Skill</text>
  <text x="148" y="218" text-anchor="middle" class="small">codified expertise</text>
  <text x="148" y="242" text-anchor="middle" class="small">method and checks</text>
  <rect x="295" y="150" width="185" height="118" class="box mcp"/>
  <text x="388" y="188" text-anchor="middle" class="label">MCP</text>
  <text x="388" y="218" text-anchor="middle" class="small">capability protocol</text>
  <text x="388" y="242" text-anchor="middle" class="small">tools and resources</text>
  <rect x="535" y="150" width="185" height="118" class="box agent"/>
  <text x="628" y="188" text-anchor="middle" class="label">Agent</text>
  <text x="628" y="218" text-anchor="middle" class="small">plans and decides</text>
  <text x="628" y="242" text-anchor="middle" class="small">executes loops</text>
  <rect x="775" y="150" width="130" height="118" class="box system"/>
  <text x="840" y="188" text-anchor="middle" class="label">Outcome</text>
  <text x="840" y="218" text-anchor="middle" class="small">artifact</text>
  <text x="840" y="242" text-anchor="middle" class="small">or action</text>
  <line x1="240" y1="209" x2="295" y2="209" class="line"/>
  <line x1="480" y1="209" x2="535" y2="209" class="line"/>
  <line x1="720" y1="209" x2="775" y2="209" class="line"/>
  <text x="480" y="330" text-anchor="middle" class="small">Reusable know-how + standard capability interface + autonomous orchestration</text>
</svg>
